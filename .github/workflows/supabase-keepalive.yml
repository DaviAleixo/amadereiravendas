name: Manter Supabase Ativo (Keep-Alive)

on:
  schedule:
    # Executa 2 vezes por dia: às 06:00 e às 18:00 UTC (03:00 e 15:00 no horário de Brasília)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub se desejar

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer requisição ao banco Supabase
        run: |
          echo "Disparando ping de atividade para o Supabase..."
          curl -f -s -X GET "https://mbpkdmswzhyibmrlhadi.supabase.co/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1icGtkbXN3emh5aWJtcmxoYWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDkxMTEsImV4cCI6MjEwNTA4NTExMX0.tYmZ-lWFjpoIeuNCFVjw51PgIxwBaTh_5WadiyfjlT0' }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1icGtkbXN3emh5aWJtcmxoYWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDkxMTEsImV4cCI6MjEwNTA4NTExMX0.tYmZ-lWFjpoIeuNCFVjw51PgIxwBaTh_5WadiyfjlT0' }}" \
            -H "Range: 0-0"
          echo ""
          echo "Supabase acordado e ativo com sucesso!"
